spring.application.name=app

# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/checkpointz_db
spring.datasource.username=root
spring.datasource.password=

# O JPA cria as tabelas automaticamente para você
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# CHAVES DE API SECRETAS
api.ggdeals.key=
api.rawg.key=
api.steam.key=

# CONFIGURAÇÕES DE E-MAIL (GMAIL)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Coloque o seu e-mail real do gmail abaixo:
spring.mail.username=
# Coloque a senha de 16 letras gerada pela Google (tudo junto, sem espaços):
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.servlet.session.tracking-modes=cookie