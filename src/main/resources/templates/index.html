<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <form action="/api/login" method="POST">
            <h2>Login</h2>

            <div th:if="${erro}" style="color: #e94560; background: rgba(233, 69, 96, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px solid #e94560; font-weight: bold;">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${erro}"></span>
            </div>

            <div th:if="${sucesso}" style="color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px solid #4ade80; font-weight: bold;">
                <i class="fas fa-check-circle"></i> <span th:text="${sucesso}"></span>
            </div>

            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="usuario" placeholder="Digite seu usuário" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="senha" placeholder="Digite sua senha" required>
            </div>

            <a href="#" class="forgot-password">Esqueceu a senha?</a>

            <button type="submit" class="login-button">Entrar</button>

            <div class="signup-link">
                <p>Não tem uma conta? <a href="/cadastro">Cadastre-se</a></p>
            </div>
        </form>
    </div>

</body>
</html>
