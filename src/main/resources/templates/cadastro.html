<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="cadastro-card">
            <div class="logo">
                Cadastre-se
            </div>
            
            <form action="/api/cadastro" method="POST">
                
                <div th:if="${erro}" style="color: #e94560; background: rgba(233, 69, 96, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px solid #e94560; font-weight: bold;">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${erro}"></span>
                </div>

                <div th:if="${sucesso}" style="color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px solid #4ade80; font-weight: bold;">
                    <i class="fas fa-check-circle"></i> <span th:text="${sucesso}"></span>
                </div>

                <div class="input-group">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Crie seu usuário" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu melhor e-mail" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha" required>
                </div>

                <button type="submit" class="btn-entrar">Cadastrar</button>
            </form>

            <div class="footer-links">
                <p>Já tem uma conta? <a href="/index">Faça login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
