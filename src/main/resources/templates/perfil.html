<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${usuario.username} + ' - Perfil CheckPointZ'"></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/feed.css}">
    <link rel="stylesheet" th:href="@{/css/perfil.css}">
</head>
<body>
    <nav class="top-nav">
        <a th:href="@{/feed}" class="back-link"><i class="fas fa-arrow-left"></i> Voltar para o Feed</a>
        
        <form action="/pesquisar" method="get" class="search-bar" role="search">
            <input type="text" name="q" placeholder="Procurar jogos ou utilizadores...">
            <button type="submit" aria-label="Buscar"><i class="fas fa-search"></i></button>
        </form>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="banner"></div>
            <div class="profile-info-main">
                <img class="avatar-large" th:src="${usuario.fotoPerfil != null && !usuario.fotoPerfil.isEmpty() ? usuario.fotoPerfil : 'https://th.bing.com/th/id/R.4fa196e40b50668e0d732be31bc2dbfe?rik=Xci%2fN2aZPE%2bfAQ&pid=ImgRaw&r=0'}">
                
                <div class="user-details">
                    <h1 th:text="${usuario.username}"></h1>
                    <p class="bio" th:text="${usuario.descricao != null && !usuario.descricao.isEmpty() ? usuario.descricao : 'Nenhuma biografia adicionada ainda.'}"></p>
                    
                    <div class="social-links" th:if="${usuario.plataformasConectaveis != null && !usuario.plataformasConectaveis.isEmpty()}">
                        <span th:each="plat : ${#strings.arraySplit(usuario.plataformasConectaveis, '###')}">
                            <a class="platform-badge" th:href="${#strings.arraySplit(plat, '|||')[1]}" target="_blank">
                                <i class="fas fa-link"></i> <span th:text="${#strings.arraySplit(plat, '|||')[0]}"></span>
                            </a>
                        </span>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; height: fit-content;" th:if="${session.usuarioLogado != null and session.usuarioLogado.userId == usuario.userId}">
                    <button class="btn-edit-profile" onclick="abrirModalEdicao()">
                        <i class="fas fa-edit"></i> Editar Perfil
                    </button>
                    <a th:href="@{/logout}" class="btn-logout">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </a>
                </div>

                <form th:action="@{/conectar/{amigoId}(amigoId=${usuario.userId})}" method="post" th:if="${session.usuarioLogado != null and session.usuarioLogado.userId != usuario.userId}">
                    <button type="submit" class="btn-connect" th:if="${!jaConectado}">
                        <i class="fas fa-user-plus"></i> Conectar
                    </button>
                    <button type="button" class="btn-connect connected" th:if="${jaConectado}" style="background: #2a2a4a; color: #4ade80; cursor: default;">
                        <i class="fas fa-check"></i> Conectados
                    </button>
                </form>
            </div>
        </div>

        <div class="highlights-section">
            <h3><i class="fas fa-trophy"></i> Conquista em Destaque</h3>
            <div class="highlight-card">
                <p th:text="${usuario.conquistaDestaque != null && !usuario.conquistaDestaque.isEmpty() ? usuario.conquistaDestaque : 'O utilizador ainda não selecionou um destaque.'}"></p>
            </div>
        </div>

        <div class="create-post-section" th:if="${session.usuarioLogado != null and session.usuarioLogado.userId == usuario.userId}" style="background: #1a1a2e; padding: 20px 30px; border-bottom: 1px solid #2a2a4a; border-top: 1px solid #2a2a4a;">
            <form th:action="@{/post/novo}" method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 15px;">
                
                <textarea name="texto" placeholder="Sobre o que quer falar hoje? (Dicas, análises, conquistas...)" required style="resize: none; height: 100px; width: 100%; border-radius: 10px; padding: 15px; background: #16213e; color: white; border: 1px solid #2a2a4a; font-size: 1em;"></textarea>
                
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div style="display: flex; gap: 10px; flex-grow: 1;">
                        <label for="post-img" class="btn-img-upload"><i class="fas fa-image"></i> Imagem (PNG/JPG)</label>
                        <input type="file" name="imagensArquivos" accept="image/png, image/jpeg, image/jpg" id="post-img" multiple style="display:none;">
                        
                        <select name="nomeJogoVinculado" class="game-select-input">
                            <option value="">Nenhum Jogo (Opcional)</option>
                            <option th:each="jogo : ${todosJogos}" th:value="${jogo.nomeJogo}" th:text="${jogo.nomeJogo}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn-publish-post"><i class="fas fa-paper-plane"></i> Publicar</button>
                </div>
            </form>
        </div>

        <div class="timeline-section">
            <h3 class="timeline-title"><i class="fas fa-stream"></i> Publicações Recentes</h3>
            
            <div th:if="${postsUsuario == null || postsUsuario.isEmpty()}" class="no-posts">
                <i class="fas fa-comment-slash"></i>
                <p>Nenhuma publicação encontrada.</p>
            </div>

            <article th:each="post : ${postsUsuario}" style="background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; flex-direction: column; width: 100%; box-sizing: border-box;">
                <header style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;">
                    <img th:src="${post.usuario.fotoPerfil != null && !post.usuario.fotoPerfil.isEmpty() ? post.usuario.fotoPerfil : 'https://th.bing.com/th/id/R.4fa196e40b50668e0d732be31bc2dbfe?rik=Xci%2fN2aZPE%2bfAQ&pid=ImgRaw&r=0'}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;">
                    <div>
                        <strong style="color: #fff; font-size: 1.1em; display: block;">
                            <a th:href="@{/perfil/{username}(username=${post.usuario.username})}" th:text="${post.usuario.username}" style="color: white; text-decoration: none;"></a>
                        </strong> 
                        <span th:text="${#temporals.format(post.data, 'dd/MM/yyyy')} + ' às ' + ${#temporals.format(post.hora, 'HH:mm')}" style="color: #aaa; font-size: 0.85em;"></span>
                        <span th:if="${post.jogoVinculado != null}" style="display: block; margin-top: 5px; color: #aaa; font-size: 0.85em;">falou sobre <b style="color:#a980ff; background: rgba(169,128,255,0.1); padding: 2px 8px; border-radius: 10px;" th:text="${post.jogoVinculado.nomeJogo}"></b></span>
                    </div>
                </header>
                
                <div style="flex-grow: 1;">
                    <p th:text="${post.texto}" style="color: #ccc; line-height: 1.5; margin-bottom: 15px; word-wrap: break-word;"></p>
                    <div th:if="${post.imagensUrls != null and !post.imagensUrls.isEmpty()}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; margin-bottom: 15px;">
                        <img th:each="imgUrl : ${post.imagensUrls}" th:src="${imgUrl}" style="width: 100%; height: 300px; object-fit: cover; border-radius: 8px; border: 1px solid #302b63;">
                    </div>
                </div>

                <footer style="display: flex; justify-content: flex-start; gap: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; margin-top: auto; flex-wrap: wrap;">
                    <button type="button" th:onclick="|reagirPostagem(${post.idPost}, 'gostei', this)|" style="background: transparent; border: 1px solid #4ade80; color: #4ade80; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9em; height: fit-content; display: flex; align-items: center; gap: 8px; transition: 0.3s;">
                        <i class="fas fa-thumbs-up"></i> Gostei (<span th:text="${post.reacaoGostei}"></span>)
                    </button>

                    <button type="button" th:onclick="|reagirPostagem(${post.idPost}, 'desgostei', this)|" style="background: transparent; border: 1px solid #e94560; color: #e94560; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9em; height: fit-content; display: flex; align-items: center; gap: 8px; transition: 0.3s;">
                        <i class="fas fa-thumbs-down"></i> Não Gostei (<span th:text="${post.reacaoDesgostei}"></span>)
                    </button>
                </footer>
            </article>
        </div>
    </div>

    <div id="modalEdicao" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Perfil</h2>
                <span class="close-btn" onclick="fecharModalEdicao()">&times;</span>
            </div>
            
            <form th:action="@{/perfil/editar}" method="post" class="edit-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Nome de Utilizador</label>
                    <input type="text" name="username" th:value="${usuario.username}" required>
                </div>
                <div class="form-group">
                    <label>Nova Senha (deixe em branco para manter a atual)</label>
                    <input type="password" name="senha" placeholder="Digite apenas se quiser alterar">
                </div>
                <div class="form-group">
                    <label>Nova Foto de Perfil (PNG, JPG ou JPEG)</label>
                    <input type="file" name="fotoPerfilArquivo" accept="image/png, image/jpeg, image/jpg">
                </div>
                <div class="form-group">
                    <label>Sobre Mim (Biografia)</label>
                    <textarea name="descricao" rows="4" th:text="${usuario.descricao}" placeholder="Fale sobre os seus jogos favoritos..."></textarea>
                </div>
                <div class="form-group">
                    <label>Conquista de Destaque</label>
                    <input type="text" name="conquistaDestaque" th:value="${usuario.conquistaDestaque}" placeholder="Ex: Platina em Elden Ring">
                </div>
                <div class="form-group" id="container-plataformas">
                    <label>Links de Conexão (Steam, Xbox, Discord, etc)</label>
                    <div class="plataforma-row">
                        <input type="text" name="nomePlataforma" placeholder="Nome (Ex: Steam)" style="width: 35%;">
                        <input type="text" name="linkPlataforma" placeholder="Link do seu perfil" style="width: 60%;">
                    </div>
                </div>
                <button type="button" class="btn-add-link" onclick="adicionarPlataforma()">+ Adicionar outro link</button>
                <button type="submit" class="btn-save">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <script>
        function abrirModalEdicao() { document.getElementById('modalEdicao').style.display = 'flex'; }
        function fecharModalEdicao() { document.getElementById('modalEdicao').style.display = 'none'; }
        window.onclick = function(event) { if (event.target == document.getElementById('modalEdicao')) fecharModalEdicao(); }
        
        function adicionarPlataforma() {
            const container = document.getElementById('container-plataformas');
            const novaLinha = document.createElement('div');
            novaLinha.className = 'plataforma-row';
            novaLinha.style.marginTop = '10px';
            novaLinha.innerHTML = `
                <input type="text" name="nomePlataforma" placeholder="Nome" style="width: 35%;">
                <input type="text" name="linkPlataforma" placeholder="Link" style="width: 60%;">
            `;
            container.appendChild(novaLinha);
        }

        function reagirPostagem(postId, tipo, botaoApertado) {
            const formData = new FormData();
            formData.append('tipo', tipo);

            fetch(`/post/${postId}/reagir`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const spanContador = botaoApertado.querySelector('span');
                
                if (tipo === 'gostei') {
                    spanContador.innerText = data.gostei;
                    botaoApertado.style.backgroundColor = 'rgba(74, 222, 128, 0.2)';
                } else {
                    spanContador.innerText = data.desgostei;
                    botaoApertado.style.backgroundColor = 'rgba(233, 69, 96, 0.2)';
                }
                
                setTimeout(() => {
                    botaoApertado.style.backgroundColor = 'transparent';
                }, 300);
            })
            .catch(erro => console.error('Erro ao registrar a reação:', erro));
        }
    </script>
</body>
</html>
